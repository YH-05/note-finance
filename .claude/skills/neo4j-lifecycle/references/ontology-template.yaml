#     cardinality: "1:N"
#   - type: EXTRACTED_FROM
#     from_label: "[Fact|Claim]"
#     to_label: Chunk
#     description: Chunk からの抽出元
#     cardinality: "N:1"
#   - type: STATES_FACT
#     from_label: Source
#     to_label: Fact
#     description: ソースが述べる事実
#     cardinality: "1:N"
#   - type: MAKES_CLAIM
#     from_label: Source
#     to_label: Claim
#     description: ソースが主張する内容
#     cardinality: "1:N"
