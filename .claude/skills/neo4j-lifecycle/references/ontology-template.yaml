relation_types:
  - type: "{{RELATION_TYPE_1}}"
    from_label: "{{RELATION_1_FROM}}"
    to_label: "{{RELATION_1_TO}}"
    description: "{{RELATION_1_DESC}}"
    properties: "{{RELATION_1_PROPS}}"          # YAML リスト（省略可）
    cardinality: "{{RELATION_1_CARD}}"          # "1:1" | "1:N" | "N:1" | "N:M"
  # 必要数だけ追加。推奨: 5-15 リレーション。
  # - type: "{{RELATION_TYPE_N}}"
  #   from_label: "{{RELATION_N_FROM}}"
  #   to_label: "{{RELATION_N_TO}}"
  #   description: "{{RELATION_N_DESC}}"
  #   properties: "{{RELATION_N_PROPS}}"
  #   cardinality: "{{RELATION_N_CARD}}"

# ---------------------------------------------------------------------------
# 共通ノード定義（全インスタンス共通）
# ---------------------------------------------------------------------------
# 以下のノードは全インスタンスに存在する基盤ノード。
# instance 固有のオントロジーで上書きする必要はない。

common_nodes:
  - label: Source
    key_property: source_id
    description: データの出典元（URL、論文、書籍等）
    required_properties: [source_id, url, title, source_type]
    optional_properties: [authority_level, language, domain, collected_at, published_at]

  - label: Entity
    key_property: entity_key
    description: 固有名詞（企業、人物、プラットフォーム等）
    required_properties: [entity_key, entity_id, name, entity_type]
    optional_properties: [updated_at]

# ---------------------------------------------------------------------------
# 正規化ルール
# ---------------------------------------------------------------------------
# Entity 名の正規化ルール。entity_linker.py が参照する。
#
# --- creator v2 参考例 ---
# normalization_rules:
#   general:
#     - 全角英数字は半角に統一
#     - 不要なスペースは除去
#     - 末尾の句読点は除去
#   per_entity_type:
#     platform: 公式英語表記（インスタ → Instagram、ココナラ → Coconala）
#     company: 公式英語表記
#     person: 日本人は漢字、外国人はアルファベット
#     organization: 公式名称
# ---

normalization_rules:
  general:
    - "{{NORM_RULE_GENERAL_1}}"
    - "{{NORM_RULE_GENERAL_2}}"
  per_entity_type:
    "{{ENTITY_TYPE_1_KEY}}": "{{NORM_RULE_TYPE_1}}"
    # 各 entity_type に対応するルールを追加

# ---------------------------------------------------------------------------
# Alias 戦略
# ---------------------------------------------------------------------------
# Entity/Concept の別名解決戦略。
#
# --- creator v2 参考例 ---
# alias_strategy:
#   enabled: true
#   fuzzy_layers: 2                # ファジーマッチングの層数
#   sources:
#     - entity-aliases.yaml        # 手動定義
#     - auto_detected              # entity_linker.py が自動検出
# ---

alias_strategy:
  enabled: "{{ALIAS_ENABLED}}"                  # true | false
  fuzzy_layers: "{{ALIAS_FUZZY_LAYERS}}"        # 推奨: 1-3
  sources:
    - "{{ALIAS_SOURCE_1}}"
    # 必要数だけ追加
