entity_types:
  - key: "{{ENTITY_TYPE_1_KEY}}"
    name_ja: "{{ENTITY_TYPE_1_NAME_JA}}"
    description: "{{ENTITY_TYPE_1_DESC}}"
    examples: "{{ENTITY_TYPE_1_EXAMPLES}}"      # YAML リスト形式
    normalization: "{{ENTITY_TYPE_1_NORM}}"      # 正規化ルール
  # 必要数だけ追加。推奨: 4-10 タイプ。
  # - key: "{{ENTITY_TYPE_N_KEY}}"
  #   name_ja: "{{ENTITY_TYPE_N_NAME_JA}}"
  #   description: "{{ENTITY_TYPE_N_DESC}}"
  #   examples: "{{ENTITY_TYPE_N_EXAMPLES}}"
  #   normalization: "{{ENTITY_TYPE_N_NORM}}"

