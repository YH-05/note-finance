content_types:
  - label: "{{CONTENT_TYPE_1_LABEL}}"
    description: "{{CONTENT_TYPE_1_DESC}}"
    key_property: "{{CONTENT_TYPE_1_KEY_PROP}}"
    text_property: "{{CONTENT_TYPE_1_TEXT_PROP}}"
    extra_properties: "{{CONTENT_TYPE_1_EXTRA}}"  # YAML リスト形式
  # 必要数だけ追加。推奨: 2-5 タイプ。
  # - label: "{{CONTENT_TYPE_N_LABEL}}"
  #   description: "{{CONTENT_TYPE_N_DESC}}"
  #   key_property: "{{CONTENT_TYPE_N_KEY_PROP}}"
  #   text_property: "{{CONTENT_TYPE_N_TEXT_PROP}}"
  #   extra_properties: "{{CONTENT_TYPE_N_EXTRA}}"

