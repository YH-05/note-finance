# =============================================================================
# ontology-template.yaml
# =============================================================================
# neo4j-lifecycle Phase A で使用するドメイン非依存のオントロジー定義テンプレート。
# プレースホルダー（{{UPPER_SNAKE_CASE}}）を対象インスタンスの値で置換して使用する。
#
# Phase B での埋め込み手順:
#   1. instance YAML の use_case / description を参照して各プレースホルダーを埋める
#   2. ユーザーとの対話（Phase A-2）で確定した値を反映する
#   3. 確定後、data/lifecycle-state/{instance}/ontology.yaml として保存する
#   4. extraction-prompt-template.md / merge-patterns-template.md が本ファイルを参照する
# =============================================================================

# ---------------------------------------------------------------------------
# メタ情報
# ---------------------------------------------------------------------------
schema_version: "{{SCHEMA_VERSION}}"          # 例: "creator-2.0", "research-2.0"
instance_name: "{{INSTANCE_NAME}}"            # 例: "creator", "research"
domain: "{{DOMAIN_DESCRIPTION}}"              # 例: "コンテンツ創作", "金融リサーチ"
created_at: "{{CREATED_AT}}"                  # ISO 8601 形式
updated_at: "{{UPDATED_AT}}"

# ---------------------------------------------------------------------------
# ConceptCategory 定義
# ---------------------------------------------------------------------------
# 上位概念カテゴリ。Concept ノードを分類する。
# layer で What（何についてか）/ How（どう伝えるか）等の軸を区別する。
#
# --- creator v2 参考例 ---
# concept_categories:
#   - name: MonetizationMethod
#     name_ja: 収益化手段
#     layer: What
#     description: 収入を生み出す手段やビジネスモデル
#   - name: AcquisitionChannel
#     name_ja: 集客チャネル
#     layer: What
#     description: 顧客獲得・集客のためのチャネル
#   - name: Skill
#     name_ja: スキル・技能
#     layer: What
#     description: 専門的な技能や知識
#   - name: Audience
#     name_ja: ターゲット層
#     layer: What
#     description: 想定読者・顧客のセグメント
#   - name: RevenueModel
#     name_ja: 収益モデル
#     layer: What
#     description: 収益構造のパターン
#   - name: SuccessMetric
#     name_ja: 成果指標
#     layer: What
#     description: KPI・成果の計測基準
#   - name: ContentFormat
#     name_ja: コンテンツ形式
#     layer: What
#     description: コンテンツの配信フォーマット
#   - name: Regulation
#     name_ja: 法規制
#     layer: What
#     description: 法令・コンプライアンス規制
#   - name: Milestone
#     name_ja: マイルストーン
#     layer: What
#     description: 時間軸の目安・到達点
#   - name: PersuasionTechnique
#     name_ja: 説得技法
#     layer: How
#     description: 説得・影響力の技法
#   - name: EmotionalHook
#     name_ja: 感情トリガー
#     layer: How
#     description: 読者の感情を動かす仕掛け
#   - name: CopyFramework
#     name_ja: 文章構成パターン
#     layer: How
#     description: ライティングのフレームワーク
#   - name: Objection
#     name_ja: 反論・障壁
#     layer: How
#     description: 読者が抱く反論や購買障壁
#   - name: Transformation
#     name_ja: 変化パターン
#     layer: How
#     description: ビフォーアフターの変容パターン
# ---

concept_categories:
  - name: "{{CONCEPT_CATEGORY_1_NAME}}"
    name_ja: "{{CONCEPT_CATEGORY_1_NAME_JA}}"
    layer: "{{CONCEPT_CATEGORY_1_LAYER}}"       # What | How | Meta 等
    description: "{{CONCEPT_CATEGORY_1_DESC}}"
  # 必要数だけ追加。推奨: 8-20 カテゴリ。
  # - name: "{{CONCEPT_CATEGORY_N_NAME}}"
  #   name_ja: "{{CONCEPT_CATEGORY_N_NAME_JA}}"
  #   layer: "{{CONCEPT_CATEGORY_N_LAYER}}"
  #   description: "{{CONCEPT_CATEGORY_N_DESC}}"

