#     normalization: 公式名称
# ---
#
# --- research v2 参考例 ---
# entity_types:
#   - key: company
#     name_ja: 企業
#     description: 上場企業・非上場企業
#     examples: [Apple Inc., トヨタ自動車]
#     normalization: 公式英語表記またはティッカー
#   - key: index
