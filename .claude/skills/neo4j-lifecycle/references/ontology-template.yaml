#     description: 企業・組織
#     examples: [Google, Match Group, リクルート]
#     normalization: 公式英語表記
#   - key: person
#     name_ja: 人物
#     description: 実在の人物
#     examples: [林知佳, Elon Musk]
#     normalization: 日本人は漢字、外国人はアルファベット
