# research-neo4j インスタンス設定
#
# 金融リサーチ・銘柄調査のナレッジグラフ。
# KG v2 スキーマ（Source / Chunk / Fact / Claim / Entity / Topic 等）を使用。
# web-research / save-to-research-graph / kg-quality-check 等が使用。

instance_name: research

# ---------------------------------------------------------------------------
# 接続情報
# ---------------------------------------------------------------------------
connection:
  bolt_uri: "bolt://localhost:7688"
  user: neo4j
  # WARNING: 平文パスワードをここに記載して commit しないこと！
  # 必ず環境変数参照 ${NEO4J_RESEARCH_PASSWORD} を使用すること。
  # 設定方法: export NEO4J_RESEARCH_PASSWORD="your_password"
  password: "${NEO4J_RESEARCH_PASSWORD}"

# ---------------------------------------------------------------------------
# MCP 設定
# ---------------------------------------------------------------------------
mcp:
  prefix: "mcp__neo4j-research__research-"
  tools:
    read: "mcp__neo4j-research__research-read_neo4j_cypher"
    write: "mcp__neo4j-research__research-write_neo4j_cypher"
    schema: "mcp__neo4j-research__research-get_neo4j_schema"

# ---------------------------------------------------------------------------
# スキーマ
# ---------------------------------------------------------------------------
schema_version: "2.0"

# ---------------------------------------------------------------------------
# 用途・説明
# ---------------------------------------------------------------------------
use_case: "web-research / save-to-research-graph / kg-quality-check / topic-discovery"
description: >
  金融リサーチ専用ナレッジグラフ。
  KG v2 スキーマに基づき Source / Author / Chunk / Fact / Claim /
  Entity / FinancialDataPoint / FiscalPeriod / Topic / Insight ノードを管理。
  article-neo4j を統合済み。
