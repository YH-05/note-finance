# ---------------------------------------------------------------------------
# Full-Text Index
# ---------------------------------------------------------------------------
fulltext_indexes:
  - name: research_entity_fulltext
    type: FULLTEXT
    label: Entity
    properties: [name]
    description: Entity 名のフルテキスト検索

  - name: research_topic_fulltext
    type: FULLTEXT
    label: Topic
    properties: [name]
    description: Topic 名のフルテキスト検索

  - name: research_fact_fulltext
    type: FULLTEXT
    label: Fact
    properties: [content]
    description: Fact テキストのフルテキスト検索

  - name: research_claim_fulltext
    type: FULLTEXT
    label: Claim
    properties: [content]
    description: Claim テキストのフルテキスト検索

  - name: research_source_fulltext
    type: FULLTEXT
    label: Source
    properties: [title]
    description: Source タイトルのフルテキスト検索

  - name: research_alias_fulltext
    type: FULLTEXT
    label: Alias
    properties: [name]
    description: Alias 名のフルテキスト検索（ファジーマッチング用）

# ---------------------------------------------------------------------------
# B-Tree Index (フィルタリング用)
# ---------------------------------------------------------------------------
btree_indexes:
  # Source (維持)
  - name: idx_research_source_type
    type: BTREE
    label: Source
    properties: [source_type]
    description: Source のタイプ別フィルタリング

  - name: idx_research_source_published
    type: BTREE
    label: Source
    properties: [published_at]
    description: Source の公開日時フィルタリング

  # Topic (維持)
  - name: idx_research_topic_category
    type: BTREE
    label: Topic
    properties: [category]
    description: Topic のカテゴリ別フィルタリング

  # Content Types (維持)
  - name: idx_research_claim_type
    type: BTREE
    label: Claim
    properties: [claim_type]
    description: Claim のタイプ別フィルタリング

  - name: idx_research_fact_type
    type: BTREE
    label: Fact
    properties: [fact_type]
    description: Fact のタイプ別フィルタリング

  - name: idx_research_fdp_metric
    type: BTREE
    label: FinancialDataPoint
    properties: [metric_name]
    description: FinancialDataPoint の指標名フィルタリング

  # ① 新設ノード用
  - name: idx_research_ticker_symbol
    type: BTREE
    label: TickerSymbol
    properties: [symbol]
    description: TickerSymbol のシンボル検索

  - name: idx_research_entity_type_name
    type: BTREE
    label: EntityType
    properties: [name]
    description: EntityType の名前検索

  # Deprecated (リレーション化により不要)
  # - idx_research_entity_type → IS_TYPE リレーションで代替
  # - idx_research_source_category → TAGGED リレーションで代替
