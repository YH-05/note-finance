# =============================================================================
# research-neo4j ontology.yaml (v3.0)
# =============================================================================
# Phase A 完了版。FIBO準拠 + 薄いハブノード設計。
# 全プロパティ→リレーション変換適用済み。
# =============================================================================

schema_version: "research-3.0"
instance_name: "research"
domain: "金融リサーチ・銘柄調査のナレッジグラフ"
created_at: "2026-03-23T15:09:06+09:00"
updated_at: "2026-03-23T18:00:00+09:00"
status: "confirmed"

# =============================================================================
# ノード定義（33ラベル）
# =============================================================================

# ---------------------------------------------------------------------------
# Common Nodes（2）— 全インスタンス共通の基盤ノード
# ---------------------------------------------------------------------------
common_nodes:
  - label: Source
    key_property: source_id
    description: データの出典元（ニュース記事、論文、レポート等）
    properties: [source_id, url, title, collected_at, published_at]

  - label: Entity
    key_property: entity_key
    description: 固有名詞（企業、人物、指数等）。entity_key は "Name::type" 形式
    properties: [entity_key, entity_id, name, enriched_at, updated_at]

# ---------------------------------------------------------------------------
# Content Types（5）— ナレッジの種類
# ---------------------------------------------------------------------------
content_types:
  - label: Fact
    key_property: fact_id
    description: 検証済みの事実・データ・統計
    properties: [fact_id, content, as_of_date, created_at]

  - label: Claim
    key_property: claim_id
    description: 主張・意見・予測・アナリストの見解
    properties: [claim_id, content, sentiment, confidence, magnitude, classified_at]

  - label: Chunk
    key_property: chunk_id
    description: ソースドキュメントの断片・セクション
    properties: [chunk_id, content, chunk_index, section_title, has_tables, char_count, created_at]

  - label: FinancialDataPoint
    key_property: datapoint_id
    description: 定量的な財務・経済データポイント
    properties: [datapoint_id, value, created_at]

  - label: Insight
    key_property: insight_id
    description: 分析から導出された洞察・知見
    properties: [insight_id, content, created_at]

# ---------------------------------------------------------------------------
# Domain Nodes（9）— ドメイン固有の構造ノード
# ---------------------------------------------------------------------------
domain_nodes:
  - label: Topic
    key_property: topic_key
    description: トピック・テーマ分類ノード。topic_key は "Name::category" 形式
    properties: [topic_key, topic_id, name]

  - label: Author
    key_property: author_id
    description: ソースの著者・執筆者・アナリスト
    properties: [author_id, name]

  - label: Stance
    key_property: stance_id
    description: アナリストのスタンス・投資判断
    properties: [stance_id, sentiment, rating, target_price, as_of_date, note]

  - label: Metric
    key_property: metric_id
    description: 財務指標の定義（Revenue, EBITDA, PER 等）
    properties: [metric_id, name]

  - label: FiscalPeriod
    key_property: period_id
    description: 会計期間（年度・四半期）
    properties: [period_id, year, quarter, type]

  - label: Sector
    key_property: sector_id
    description: 産業セクター分類（GICS準拠）
    properties: [sector_id, name]

  - label: ConceptCategory
    key_property: concept_category_id
    description: 上位概念カテゴリ（Topic の分類軸）
    properties: [concept_category_id, name, name_ja, layer]

  - label: AuthorType
    key_property: author_type_id
    description: 著者の種類分類（analyst, journalist, official 等）
    properties: [author_type_id, name, name_ja]

  - label: InstrumentClass
    key_property: instrument_class_id
    description: 金融商品の種類分類（FIBO SEC階層 L1/L2）
    properties: [instrument_class_id, name, name_ja, fibo_domain]

# ---------------------------------------------------------------------------
# Classification Nodes — Source 由来（5）
# ---------------------------------------------------------------------------
source_classification_nodes:
  - label: SourceType
    key_property: source_type_id
    description: ソースの種類分類
    properties: [source_type_id, name, name_ja]
    canonical_values: [news, blog, web, pdf, analysis, company_filing, data, academic, presentation, financial_statement, report, transcript]

  - label: Domain
    key_property: domain_id
    description: Webドメイン（ソースのサイト単位の集約）
    properties: [domain_id, name, base_url, default_language]

  - label: TrustLevel
    key_property: trust_level_id
    description: ソースの信頼度分類
    properties: [trust_level_id, name, name_ja, rank]
    canonical_values:
      - {name: official, name_ja: 公的機関, rank: 1}
      - {name: academic, name_ja: 学術, rank: 2}
      - {name: company, name_ja: 企業公式, rank: 3}
      - {name: institutional, name_ja: 機関投資家, rank: 4}
      - {name: analyst, name_ja: アナリスト, rank: 5}
      - {name: industry, name_ja: 業界, rank: 6}
      - {name: media, name_ja: メディア, rank: 7}
      - {name: primary, name_ja: 一次データ, rank: 8}
      - {name: blog, name_ja: ブログ, rank: 9}
      - {name: social, name_ja: ソーシャル, rank: 10}

  - label: Language
    key_property: language_id
    description: 言語コード（ISO 639-1）
    properties: [language_id, name, name_ja]

  - label: Pipeline
    key_property: pipeline_id
    description: データ投入パイプライン（コマンドソース）
    properties: [pipeline_id, name, description, category]
    known_values: [finance-news-workflow, wealth-scrape, web-research, pdf-archive, academic-fetch, pdf-extraction, reddit-finance-topics, manual-research, topic-discovery, equity-research]

# ---------------------------------------------------------------------------
# Classification Nodes — Entity 由来（4）
# ---------------------------------------------------------------------------
entity_classification_nodes:
  - label: EntityType
    key_property: entity_type_id
    description: Entity のサブタイプ分類（42種→14種に統合）
    properties: [entity_type_id, name, name_ja, description, normalization_rule]
    canonical_values:
      - {key: company, name_ja: 企業, consolidates: [company, fintech, subsidiary, fintech_holding, digital_bank, it_services]}
      - {key: technology, name_ja: テクノロジー, consolidates: [technology, system]}
      - {key: organization, name_ja: 機関, consolidates: [organization, central_bank, government, government_agency, institution, exchange]}
      - {key: person, name_ja: 人物}
      - {key: index, name_ja: 株価指数}
      - {key: indicator, name_ja: 経済指標, consolidates: [indicator, metric]}
      - {key: instrument, name_ja: 金融商品, consolidates: [instrument, etf, currency, currency_pair, fund, bond, asset]}
      - {key: commodity, name_ja: コモディティ}
      - {key: country, name_ja: 国・地域, consolidates: [country, region]}
      - {key: sector, name_ja: セクター, consolidates: [sector, market]}
      - {key: concept, name_ja: 概念, consolidates: [concept, model, method, theme, article_proposal, event]}
      - {key: regulation, name_ja: 規制・政策}
      - {key: broker, name_ja: ブローカー}
      - {key: product, name_ja: プロダクト, consolidates: [product, dataset, data_center]}

  - label: Identifier
    key_property: identifier_id
    description: エンティティの識別子（FIBO SecuritiesIdentification 準拠）
    properties: [identifier_id, type, value, scheme]
    identifier_types: [ticker, ISIN, LEI, CIK, SIC, FIGI]

  - label: Industry
    key_property: industry_id
    description: 産業分類（Sectorの下位分類）
    properties: [industry_id, name]

  - label: Alias
    key_property: alias_id
    description: Entity/Topic の別名・略称
    properties: [alias_id, name, alias_type, language]

# ---------------------------------------------------------------------------
# Classification Nodes — Content 由来（4）
# ---------------------------------------------------------------------------
content_classification_nodes:
  - label: FactType
    key_property: fact_type_id
    description: 事実の種類分類（76種→10種に正規化）
    properties: [fact_type_id, name, name_ja, category]
    canonical_values:
      - {name: statistic, name_ja: 統計}
      - {name: financial_metric, name_ja: 財務指標}
      - {name: macro_indicator, name_ja: マクロ指標}
      - {name: event, name_ja: イベント}
      - {name: empirical, name_ja: 実証データ}
      - {name: regulatory, name_ja: 規制}
      - {name: market_data, name_ja: 市場データ}
      - {name: strategic, name_ja: 戦略}
      - {name: methodology, name_ja: 方法論}
      - {name: risk, name_ja: リスク}

  - label: ClaimType
    key_property: claim_type_id
    description: 主張の種類分類
    properties: [claim_type_id, name, name_ja, direction]
    canonical_values:
      - {name: fundamental, name_ja: ファンダメンタル分析, direction: neutral}
      - {name: bullish, name_ja: 強気, direction: positive}
      - {name: bearish, name_ja: 弱気, direction: negative}
      - {name: technical, name_ja: テクニカル分析, direction: neutral}
      - {name: risk_event, name_ja: リスクイベント, direction: negative}
      - {name: policy_hawkish, name_ja: タカ派, direction: negative}
      - {name: sector_rotation, name_ja: セクターローテーション, direction: neutral}
      - {name: earnings_beat, name_ja: 決算上振れ, direction: positive}
      - {name: analyst_view, name_ja: アナリスト見解, direction: neutral}
      - {name: political_risk, name_ja: 政治リスク, direction: negative}

  - label: UnitOfMeasure
    key_property: unit_id
    description: 数値の単位（通貨を含む。旧 Currency ノード統合済み）
    properties: [unit_id, name, symbol, dimension]
    dimensions: [currency, percentage, ratio, count, weight, volume, time, monetary_value]

  - label: DataPointType
    key_property: datapoint_type_id
    description: データポイントの性質分類（実績/予想/予測/コンセンサス）
    properties: [datapoint_type_id, name, name_ja]
    canonical_values:
      - {name: actual, name_ja: 実績}
      - {name: estimate, name_ja: 会社予想}
      - {name: forecast, name_ja: アナリスト予測}
      - {name: consensus, name_ja: コンセンサス}

# ---------------------------------------------------------------------------
# Operational Nodes（4）— ドメインモデル外
# ---------------------------------------------------------------------------
operational_nodes:
  - label: Memory
    description: MCP Memory（設計・技術的判断等のサブラベル付き）
  - label: SkillRun
    description: スキル実行トレース
  - label: QualitySnapshot
    description: KG品質計測スナップショット
  - label: Question
    description: 調査質問（将来的に Content Type に昇格検討）

# =============================================================================
# リレーション定義（59種）
# =============================================================================

relation_types:
  # --- コンテンツ接続（7）---
  - {type: TAGGED, from: Source, to: Topic, card: "N:M", desc: ソースのトピック分類}
  - {type: STATES_FACT, from: Source, to: Fact, card: "1:N", desc: ソースが述べる事実}
  - {type: MAKES_CLAIM, from: Source, to: Claim, card: "1:N", desc: ソースが主張する内容}
  - {type: CONTAINS_CHUNK, from: Source, to: Chunk, card: "1:N", desc: ソースの断片化}
  - {type: EXTRACTED_FROM, from: "Fact|Claim", to: Chunk, card: "N:1", desc: Chunk からの抽出元}
  - {type: HAS_DATAPOINT, from: Source, to: FinancialDataPoint, card: "1:N", desc: ソースに含まれる定量データ}
  - {type: ABOUT, from: "Fact|Claim", to: Topic, card: "N:M", desc: コンテンツが扱うトピック}

  # --- エンティティ関連（4）---
  - {type: RELATES_TO, from: "Fact|FDP", to: Entity, card: "N:M", desc: データが言及するエンティティ}
  - {type: MENTIONS, from: "Fact|Claim|Chunk", to: Entity, card: "N:M", desc: コンテンツがエンティティに言及}
  - {type: IN_SECTOR, from: Entity, to: Sector, card: "N:1", desc: エンティティのセクター分類}
  - {type: ON_ENTITY, from: Stance, to: Entity, card: "N:1", desc: スタンスの対象エンティティ}

  # --- 分析・推論（6）---
  - {type: SUPPORTED_BY, from: Claim, to: Fact, card: "N:M", desc: 主張を裏付ける事実}
  - {type: CONTRADICTS, from: Claim, to: Claim, card: "N:M", desc: 矛盾する主張}
  - {type: INFLUENCES, from: Entity, to: Entity, card: "N:M", desc: エンティティ間の影響関係}
  - {type: CAUSES, from: Entity, to: Entity, card: "N:M", desc: 因果関係}
  - {type: DERIVED_FROM, from: Insight, to: Fact, card: "N:M", desc: 洞察の導出元}
  - {type: SHARES_TOPIC, from: Source, to: Source, card: "N:M", desc: 同一トピックを共有するソース}

  # --- 時系列（3）---
  - {type: FOR_PERIOD, from: FinancialDataPoint, to: FiscalPeriod, card: "N:1", desc: データの対象期間}
  - {type: NEXT_PERIOD, from: FiscalPeriod, to: FiscalPeriod, card: "1:1", desc: 次の会計期間}
  - {type: TREND, from: FinancialDataPoint, to: FinancialDataPoint, card: "N:M", desc: 時系列チェーン}

  # --- エンティティ間（9）---
  - {type: COMPETES_WITH, from: Entity, to: Entity, card: "N:M", desc: 競合関係}
  - {type: CUSTOMER_OF, from: Entity, to: Entity, card: "N:M", desc: 顧客関係}
  - {type: SUBSIDIARY_OF, from: Entity, to: Entity, card: "N:1", desc: 子会社関係}
  - {type: PARTNERS_WITH, from: Entity, to: Entity, card: "N:M", desc: パートナーシップ}
  - {type: INVESTED_IN, from: Entity, to: Entity, card: "N:M", desc: 投資関係}
  - {type: GOVERNS, from: Entity, to: Entity, card: "N:M", desc: 規制・監督関係}
  - {type: OPERATES_IN, from: Entity, to: Entity, card: "N:M", desc: 事業展開先}
  - {type: SPUN_OFF_FROM, from: Entity, to: Entity, card: "N:1", desc: スピンオフ元}
  - {type: LED_BY, from: Entity, to: Entity, card: "N:1", desc: 経営リーダー}

  # --- メタ・スタンス（8）---
  - {type: AUTHORED_BY, from: Source, to: Author, card: "N:M", desc: ソースの著者}
  - {type: COAUTHORED_WITH, from: Author, to: Author, card: "N:M", desc: 共著関係}
  - {type: CO_MENTIONED_WITH, from: Entity, to: Entity, card: "N:M", desc: 共起関係}
  - {type: MEASURES, from: Metric, to: Entity, card: "N:M", desc: 指標の計測対象}
  - {type: FOR_METRIC, from: FinancialDataPoint, to: Metric, card: "N:1", desc: データポイントの指標種別}
  - {type: HOLDS_STANCE, from: Source, to: Stance, card: "1:N", desc: ソースが示すスタンス}
  - {type: BASED_ON, from: Stance, to: Source, card: "N:1", desc: スタンスの根拠ソース}
  - {type: SOURCED_FROM, from: "Fact|Claim", to: Source, card: "N:1", desc: コンテンツの出典ソース}

  # --- レガシー（2）---
  - {type: BELONGS_TO, from: "Entity|Topic", to: "Sector|Topic", card: "N:1", desc: 所属関係}
  - {type: ASKS_ABOUT, from: Question, to: Topic, card: "N:M", desc: 調査質問のトピック}

  # --- Source 分類（5）---
  - {type: IS_SOURCE_TYPE, from: Source, to: SourceType, card: "N:1", desc: ソースの種類分類}
  - {type: FROM_DOMAIN, from: Source, to: Domain, card: "N:1", desc: ソースのWebドメイン}
  - {type: RATED_AS, from: Source, to: TrustLevel, card: "N:1", desc: ソースの信頼度評価}
  - {type: IN_LANGUAGE, from: Source, to: Language, card: "N:1", desc: ソースの言語}
  - {type: INGESTED_VIA, from: Source, to: Pipeline, card: "N:1", desc: データ投入パイプライン}

  # --- Entity 分類（5）---
  - {type: IS_TYPE, from: Entity, to: EntityType, card: "N:1", desc: エンティティのサブタイプ}
  - {type: HAS_IDENTIFIER, from: Entity, to: Identifier, card: "N:M", desc: FIBO hasIdentifier パターン}
  - {type: IN_INDUSTRY, from: Entity, to: Industry, card: "N:1", desc: 産業分類（Sectorの下位）}
  - {type: ALIAS_OF, from: Alias, to: "Entity|Topic", card: "N:1", desc: 別名の正規化リンク}
  - {type: IS_INSTRUMENT_CLASS, from: Entity, to: InstrumentClass, card: "N:1", desc: FIBO 金融商品種類分類}

  # --- Content 分類（4）---
  - {type: IS_FACT_TYPE, from: Fact, to: FactType, card: "N:1", desc: 事実の種類分類}
  - {type: IS_CLAIM_TYPE, from: Claim, to: ClaimType, card: "N:1", desc: 主張の種類分類}
  - {type: IN_UNIT, from: "FDP|Stance", to: UnitOfMeasure, card: "N:1", desc: 単位（通貨含む）}
  - {type: IS_DATAPOINT_TYPE, from: FinancialDataPoint, to: DataPointType, card: "N:1", desc: 実績/予想/予測/コンセンサス}

  # --- Domain 分類（3）---
  - {type: IS_CATEGORY, from: Topic, to: ConceptCategory, card: "N:1", desc: トピックの上位概念カテゴリ}
  - {type: AFFILIATED_WITH, from: Author, to: Entity, card: "N:1", desc: 著者の所属組織}
  - {type: IS_AUTHOR_TYPE, from: Author, to: AuthorType, card: "N:1", desc: 著者の種類分類}

  # --- 階層・参照（3）---
  - {type: PARENT_CLASS, from: InstrumentClass, to: InstrumentClass, card: "N:1", desc: InstrumentClass L2→L1 階層}
  - {type: IN_PARENT_SECTOR, from: Industry, to: Sector, card: "N:1", desc: 産業の親セクター}
  - {type: ISSUED_BY, from: Identifier, to: Entity, card: "N:1", desc: 識別子の発行機関}

# =============================================================================
# ConceptCategory 定義（topic.category 46種 → 8大分類）
# =============================================================================
concept_categories:
  - {name: MacroEconomics, name_ja: マクロ経済, layer: What, source_categories: [macro, political, geopolitical, geopolitics]}
  - {name: EquityResearch, name_ja: 株式リサーチ, layer: What, source_categories: [stock, earnings, valuation, equity_research, competition, competitive_analysis, kpi]}
  - {name: SectorAnalysis, name_ja: セクター分析, layer: What, source_categories: [sector, sector_analysis, cross_sector, industry-trend, cost_competition]}
  - {name: InvestmentStrategy, name_ja: 投資戦略, layer: What, source_categories: [investment_strategy, investment_framework, investment, institutional_investing, capital-allocation, fund_comparison, strategy]}
  - {name: Technology, name_ja: テクノロジー, layer: What, source_categories: [technology, ai, quantitative_finance, data_analysis]}
  - {name: WealthManagement, name_ja: 資産形成, layer: What, source_categories: [wealth, assets]}
  - {name: Regulation, name_ja: 規制, layer: What, source_categories: [regulatory, regulation, governance, corporate-action]}
  - {name: ContentPlanning, name_ja: コンテンツ企画, layer: Meta, source_categories: [content_planning, reddit, theme]}

# =============================================================================
# InstrumentClass 階層（FIBO SEC domain 準拠）
# =============================================================================
instrument_class_hierarchy:
  - name: equity
    name_ja: 株式
    fibo_domain: SEC/Equities
    children: [common_share, preferred_share, depositary_receipt]
  - name: debt
    name_ja: 債券
    fibo_domain: SEC/Debt
    children: [government_bond, corporate_bond, convertible]
  - name: fund
    name_ja: ファンド
    fibo_domain: SEC/Funds
    children: [etf, mutual_fund, money_market]
  - name: derivative
    name_ja: デリバティブ
    fibo_domain: DER
    children: [option, future, swap]
  - name: currency
    name_ja: 通貨
    fibo_domain: IND/ForeignExchange
    children: [fiat, crypto, currency_pair]
  - name: commodity
    name_ja: コモディティ
    children: [energy, metal, agricultural]
  - name: index_basket
    name_ja: 指数・バスケット
    fibo_domain: SEC/Securities/SecuritiesBaskets
    children: [equity_index, bond_index, commodity_index]

# =============================================================================
# 正規化ルール
# =============================================================================
normalization_rules:
  general:
    - 全角英数字は半角に統一
    - 不要なスペースは除去
    - 末尾の句読点は除去
  per_entity_type:
    company: 公式英語表記またはティッカー
    technology: 公式英語表記
    organization: 公式英語略称
    person: アルファベットフルネーム
    index: 公式略称
    indicator: 公式略称
    instrument: ティッカーまたは公式名称
    commodity: 公式英語名
    country: 英語正式名
    sector: GICS セクター名
    concept: 公式英語表記
    regulation: 公式英語名
    broker: 公式英語表記
    product: 公式英語名

# =============================================================================
# Alias 戦略
# =============================================================================
alias_strategy:
  enabled: true
  fuzzy_layers: 2  # 完全一致 + Jaro-Winkler > 0.85
  sources:
    - auto_detected
