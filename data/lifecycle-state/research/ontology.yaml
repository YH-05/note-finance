# ---------------------------------------------------------------------------
# Content Type 定義
# ---------------------------------------------------------------------------
# ② CUSTOMIZED: 2026-03-23 確定
content_types:
  - label: Fact
    description: 検証済みの事実・データ・統計
    key_property: fact_id
    text_property: content
    extra_properties: [as_of_date, created_at]
    count: 1518
    deprecated_properties:
      - name: fact_type
        reason: "IS_FACT_TYPE→FactType に変換（76種→正規化）"
      - name: source_url
        reason: "STATES_FACT←Source で98.8%カバー。冗長"

  - label: Claim
    description: 主張・意見・予測・アナリストの見解
    key_property: claim_id
    text_property: content
    extra_properties: [sentiment, confidence, magnitude, classified_at]
    count: 1145
    deprecated_properties:
      - name: claim_type
        reason: "IS_CLAIM_TYPE→ClaimType に変換"

  - label: Chunk
    description: ソースドキュメントの断片・セクション
    key_property: chunk_id
    text_property: content
    extra_properties: [chunk_index, section_title, has_tables, char_count, created_at]
    count: 1015

  - label: FinancialDataPoint
    description: 定量的な財務・経済データポイント
    key_property: datapoint_id
    text_property: null
    extra_properties: [value, source_hash, is_estimate, created_at]
    count: 430
    deprecated_properties:
      - name: metric_name
        reason: "FOR_METRIC→Metric で代替（現在5.1%→バックフィル必要）"
      - name: unit
        reason: "IN_UNIT→UnitOfMeasure に変換"
      - name: currency
        reason: "IN_CURRENCY→Currency に変換"

  - label: Insight
    description: 分析から導出された洞察・知見
    key_property: insight_id
    text_property: content
    extra_properties: [created_at]
    count: 23

