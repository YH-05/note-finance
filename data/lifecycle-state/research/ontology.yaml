# ---------------------------------------------------------------------------
# Common Nodes（全インスタンス共通）
# ---------------------------------------------------------------------------
# ① CUSTOMIZED: 2026-03-23 確定 (v3: 大幅リレーション化)
common_nodes:
  - label: Source
    key_property: source_id
    description: データの出典元（ニュース記事、論文、レポート等）
    required_properties: [source_id, url, title, source_type]
    optional_properties: [collected_at, published_at]
    deprecated_properties:
      - name: category
        reason: "TAGGED→Topic で99.5%重複"
        migration: "Topic.category で代替"
      - name: domain
        reason: "FROM_DOMAIN→Domain に変換"
      - name: authority_level
        reason: "RATED_AS→TrustLevel に変換"
      - name: language
        reason: "IN_LANGUAGE→Language に変換"
      - name: command_source
        reason: "INGESTED_VIA→Pipeline に変換"
    notes:
      url: "Source の一意ロケータのためプロパティ維持。ドメイン部分は FROM_DOMAIN→Domain でカバー"
    count: 1709
    source_type_normalization:
      # 16種 → 12種に統合
      canonical_types:
        - news         # ニュース記事 (743)
        - blog         # ブログ記事 (431)
        - web          # Webページ (164)
        - pdf          # PDF文書 (119)
        - analysis     # 分析レポート (97)
        - company_filing  # 企業開示 (26)
        - data         # データソース (25)
        - academic     # 学術論文 (53) ← academic_paper + paper + academic
        - presentation # プレゼンテーション (22)
        - financial_statement  # 財務諸表 (10)
        - report       # レポート (12) ← report + white_paper
        - transcript   # トランスクリプト (6)
      merge_mapping:
        academic_paper: academic
        paper: academic
        white_paper: report
        media: news    # 1件のみ
    property_additions:
      - name: language
        type: optional
        description: ソースの言語コード（ISO 639-1）。URLから自動推定可能
        auto_populate: "URLドメインから推定 (.jp→ja, .com→en等)"
        coverage: "7.5% (128/1709) → バックフィル対象"
      - name: domain
        type: optional
        description: ソースのWebドメイン。URLから自動抽出
        auto_populate: "urlparse(url).netloc"
        coverage: "19.4% (331/1709) → バックフィル対象"
    backfill_plan:
      - property: category
        current_coverage: "71.4% (1221/1709)"
        target: "100%"
        method: "Topic TAGGED リレーションから推定"
      - property: published_at
        current_coverage: "61.7% (1054/1709)"
        target: "90%+"
        method: "RSS published フィールド、URL内日付パターンから推定"
      - property: language
        current_coverage: "7.5% (128/1709)"
        target: "100%"
        method: "URLドメインから自動推定"
      - property: domain
        current_coverage: "19.4% (331/1709)"
        target: "100%"
        method: "urlparse(url).netloc で自動抽出"

  - label: Entity
    key_property: entity_key
    description: 固有名詞（企業、人物、指数等）
    required_properties: [entity_key, entity_id, name]
    optional_properties: [enriched_at, updated_at]
    count: 1013
    deprecated_properties:
      - name: entity_type
        reason: "IS_TYPE→EntityType に変換"
        note: "entity_key (Name::type) に型情報が残るため一意性は維持"
      - name: ticker
        reason: "HAS_TICKER→TickerSymbol に変換"
      - name: sector
        reason: "IN_SECTOR→Sector で88.5%重複"
      - name: industry
        reason: "IN_INDUSTRY→Industry に変換"
      - name: sec_cik
        reason: "HAS_SEC_REGISTRATION→SECRegistration に変換"
      - name: sec_name
        reason: "HAS_SEC_REGISTRATION→SECRegistration に変換"
      - name: sic_code
        reason: "HAS_SEC_REGISTRATION→SECRegistration に変換"
      - name: sic_description
        reason: "HAS_SEC_REGISTRATION→SECRegistration に変換"

