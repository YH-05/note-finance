# 正規化ルール (Phase A-4)
# ---------------------------------------------------------------------------
normalization_rules:
  general:
    - 全角英数字は半角に統一
    - 不要なスペースは除去
    - 末尾の句読点は除去
  per_entity_type:
    company: 公式英語表記またはティッカー
    technology: 公式英語表記
    organization: 公式英語略称
    person: アルファベットフルネーム
    index: 公式略称
    indicator: 公式略称
    instrument: ティッカーまたは公式名称
    commodity: 公式英語名
    country: 英語正式名
    sector: GICS セクター名
    concept: 公式英語表記
    regulation: 公式英語名
    broker: 公式英語表記
    product: 公式英語名

